[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmap-scan"
version = "0.1.2"
description = "Map every AI API call in a codebase — offline, no LLM, no keys. Opens a webpage of your providers, models, and agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Brevitas" }]
keywords = ["llm", "openai", "anthropic", "scanner", "agents", "observability"]
dependencies = [
    "click>=8.1.0",
]

[project.urls]
Homepage = "https://github.com/brevitas-ai/agentmap"

[project.scripts]
agentmap = "agentmap.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentmap*"]
